<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>我的专属工作台</title>
  <meta name="description" content="个人专属工作台：每日计划、爆款视频、灵感记录、锻炼身体、每日阅读、英语学习。" />
  <meta name="theme-color" content="#5b7cfa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="工作台" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 移动端顶部栏 -->
  <header class="topbar">
    <button class="icon-btn" id="menuToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-title" id="topbarTitle">每日计划</div>
    <button class="icon-btn ghost" id="installBtn" aria-label="安装" title="安装到主屏幕" style="display:none">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </button>
  </header>

  <div class="layout">
    <!-- 左侧纵向导航栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">台</div>
        <div class="brand-text">
          <div class="brand-name">我的工作台</div>
          <div class="brand-sub" id="brandDate">—</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="plan"><span class="nav-ico">📅</span><span class="nav-label">每日计划</span></button>
        <button class="nav-item" data-view="video"><span class="nav-ico">🎬</span><span class="nav-label">爆款视频</span></button>
        <button class="nav-item" data-view="idea"><span class="nav-ico">💡</span><span class="nav-label">灵感记录</span></button>
        <button class="nav-item" data-view="exercise"><span class="nav-ico">🏃</span><span class="nav-label">锻炼身体</span></button>
        <button class="nav-item" data-view="reading"><span class="nav-ico">📚</span><span class="nav-label">每日阅读</span></button>
        <button class="nav-item" data-view="english"><span class="nav-ico">🔤</span><span class="nav-label">英语学习</span></button>
      </nav>

      <div class="sidebar-foot">
        <button class="nav-item foot" data-view="settings"><span class="nav-ico">⚙️</span><span class="nav-label">设置</span></button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <!-- 主内容区 -->
    <main class="main" id="main">
      <div class="view" id="view-plan"></div>
      <div class="view" id="view-video" hidden></div>
      <div class="view" id="view-idea" hidden></div>
      <div class="view" id="view-exercise" hidden></div>
      <div class="view" id="view-reading" hidden></div>
      <div class="view" id="view-english" hidden></div>
      <div class="view" id="view-settings" hidden></div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
